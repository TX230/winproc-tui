name: Release verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".cargo/config.toml"
      - ".github/workflows/release-verify.yml"
      - "assets/screenshots/**"
      - "docs/**"
      - "src/**"
      - "build.rs"
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE"
      - "README.md"
      - "scripts/package-release.ps1"
  push:
    branches:
      - main
    paths:
      - ".cargo/config.toml"
      - ".github/workflows/release-verify.yml"
      - "assets/screenshots/**"
      - "docs/**"
      - "src/**"
      - "build.rs"
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE"
      - "README.md"
      - "scripts/package-release.ps1"

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify artifacts
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust 1.95.0
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy
          rustup default 1.95.0

      - name: Install cargo-audit 0.22.2
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit dependencies including warnings
        run: cargo audit --deny warnings

      - name: Package and verify release artifacts
        shell: pwsh
        run: .\scripts\package-release.ps1

      - name: Retain verified artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            target/package/winproc-tui-*.crate
            dist/winproc-tui-*-windows-x64.zip
            dist/winproc-tui-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
