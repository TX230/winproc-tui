[package]
name = "winproc-tui"
version = "1.8.0"
edition = "2024"
rust-version = "1.95"
description = "A lightweight process monitoring tool for Windows 11, featuring live system-wide and per-process resource metrics (including .NET runtime metrics), time-series analysis, and recording"
license = "MIT"
repository = "https://github.com/TX230/winproc-tui"
readme = "README.md"
keywords = ["windows", "process", "monitor", "tui", "diagnostics"]
categories = ["command-line-utilities"]
publish = ["crates-io"]
include = [
    "/src/**",
    "/assets/screenshots/*.png",
    "/docs/**",
    "/build.rs",
    "/LICENSE",
    "/README.md",
]

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
chrono = { version = "0.4.44", features = ["clock"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29"
jsonschema = { version = "0.60.2", default-features = false }
ratatui = "0.30.2"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sysinfo = "0.39"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "io-std", "time", "sync", "macros"] }
toml = "1.1"
uuid = { version = "1.29.0", features = ["v4"] }
winapi = { version = "0.3.9", features = ["combaseapi", "objbase", "shellapi", "shlobj", "shtypes", "consoleapi", "dxgi", "errhandlingapi", "fileapi", "handleapi", "iphlpapi", "jobapi2", "libloaderapi", "memoryapi", "namedpipeapi", "pdh", "processthreadsapi", "psapi", "synchapi", "sysinfoapi", "tlhelp32", "unknwnbase", "wincon", "winerror", "winnt", "winreg", "winuser", "winver", "wow64apiset", "securitybaseapi", "sddl"] }

[build-dependencies]
winresource = "0.1.31"
