[package]
name = "winproc-tui"
version = "1.3.1"
edition = "2024"
rust-version = "1.95"
description = "A keyboard-first process monitoring tool for Windows 11 with live system-wide and per-process resource metrics including .NET runtime metrics, time-series analysis, and recording"
license = "MIT"
repository = "https://github.com/TX230/winproc-tui"
readme = "README.md"
keywords = ["windows", "process", "monitor", "tui", "diagnostics"]
categories = ["command-line-utilities"]
publish = ["crates-io"]
include = [
    "/src/**",
    "/assets/screenshots/*.png",
    "/docs/**",
    "/build.rs",
    "/LICENSE",
    "/README.md",
]

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
chrono = { version = "0.4.44", features = ["clock"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sysinfo = "0.39"
toml = "1.1"
winapi = { version = "0.3.9", features = ["consoleapi", "dxgi", "errhandlingapi", "fileapi", "handleapi", "iphlpapi", "jobapi2", "libloaderapi", "memoryapi", "namedpipeapi", "pdh", "processthreadsapi", "psapi", "synchapi", "sysinfoapi", "tlhelp32", "unknwnbase", "wincon", "winerror", "winnt", "winreg", "winuser", "winver", "wow64apiset"] }

[build-dependencies]
winresource = "0.1.31"
